[project]
name = "turboio-dashboard"
version = "0.1.0"
description = "Self-hosted, bounded Turbo IO dashboard API and MCP adapter"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "jsonschema>=4.23,<5", "mcp>=1.28,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
turbo-dashboard = "turbo_dashboard.cli:main"
turbo-dashboard-mcp = "turbo_dashboard.mcp_server:main"
turbo-app = "turbo_dashboard.app_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turbo_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
